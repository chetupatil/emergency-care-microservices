networks:
  health-app-network:
    driver: bridge

volumes:
  mysql-data:

services:
  # ---------------------------------------------------------------
  # STEP 1: Infra — MySQL, Kafka, Zookeeper
  # ---------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3307:3306"   # host:container — avoids clashing with a local MySQL on 3306
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infra/mysql-init:/docker-entrypoint-initdb.d
    networks:
      - health-app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - health-app-network

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - health-app-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ---------------------------------------------------------------
  # STEP 2: Infra services — Config Server, Eureka, API Gateway
  # ---------------------------------------------------------------
  config-server:
    build: ./config-server
    container_name: config-server
    restart: unless-stopped
    ports:
      - "8888:8888"
    networks:
      - health-app-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  discovery-server:
    build: ./discovery-server
    container_name: discovery-server
    restart: unless-stopped
    ports:
      - "8761:8761"
    depends_on:
      config-server:
        condition: service_healthy
    networks:
      - health-app-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      EUREKA_URI: http://discovery-server:8761/eureka/
      CONFIG_SERVER_URI: http://config-server:8888
    depends_on:
      discovery-server:
        condition: service_healthy
    networks:
      - health-app-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ---------------------------------------------------------------
  # STEP 3: user-service — registration/login/profile
  # ---------------------------------------------------------------
  user-service:
    build: ./user-service
    container_name: user-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      EUREKA_URI: http://discovery-server:8761/eureka/
      CONFIG_SERVER_URI: http://config-server:8888
      DB_URL: jdbc:mysql://mysql:3306/user_db
      DB_USERNAME: app_user
      DB_PASSWORD: app_password
      JWT_SECRET: dev-only-secret-key-change-this-before-any-real-deployment-1234567890
    depends_on:
      mysql:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    networks:
      - health-app-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------------
  # STEP 4: contact-service — emergency contacts
  # ---------------------------------------------------------------
  contact-service:
    build: ./contact-service
    container_name: contact-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      EUREKA_URI: http://discovery-server:8761/eureka/
      CONFIG_SERVER_URI: http://config-server:8888
      DB_URL: jdbc:mysql://mysql:3306/contact_db
      DB_USERNAME: app_user
      DB_PASSWORD: app_password
      JWT_SECRET: dev-only-secret-key-change-this-before-any-real-deployment-1234567890
      INTERNAL_API_KEY: dev-only-internal-key-change-this-before-any-real-deployment
    depends_on:
      mysql:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    networks:
      - health-app-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------------
  # STEP 5: emergency-service — SOS trigger + Kafka orchestration
  # ---------------------------------------------------------------
  emergency-service:
    build: ./emergency-service
    container_name: emergency-service
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      EUREKA_URI: http://discovery-server:8761/eureka/
      CONFIG_SERVER_URI: http://config-server:8888
      DB_URL: jdbc:mysql://mysql:3306/emergency_db
      DB_USERNAME: app_user
      DB_PASSWORD: app_password
      JWT_SECRET: dev-only-secret-key-change-this-before-any-real-deployment-1234567890
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    networks:
      - health-app-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------------
  # STEP 6: facility-service — hospital/ambulance directory + dispatch
  # ---------------------------------------------------------------
  facility-service:
    build: ./facility-service
    container_name: facility-service
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      EUREKA_URI: http://discovery-server:8761/eureka/
      CONFIG_SERVER_URI: http://config-server:8888
      DB_URL: jdbc:mysql://mysql:3306/facility_db
      DB_USERNAME: app_user
      DB_PASSWORD: app_password
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    networks:
      - health-app-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------------
  # STEP 6: notification-service — SMS/call dispatch (stubbed)
  # ---------------------------------------------------------------
  notification-service:
    build: ./notification-service
    container_name: notification-service
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      EUREKA_URI: http://discovery-server:8761/eureka/
      CONFIG_SERVER_URI: http://config-server:8888
      DB_URL: jdbc:mysql://mysql:3306/notification_db
      DB_USERNAME: app_user
      DB_PASSWORD: app_password
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      INTERNAL_API_KEY: dev-only-internal-key-change-this-before-any-real-deployment
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      contact-service:
        condition: service_healthy
    networks:
      - health-app-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8085/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------------
  # STEP 7: membership-service — plans + subscriptions
  # ---------------------------------------------------------------
  membership-service:
    build: ./membership-service
    container_name: membership-service
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      EUREKA_URI: http://discovery-server:8761/eureka/
      CONFIG_SERVER_URI: http://config-server:8888
      DB_URL: jdbc:mysql://mysql:3306/membership_db
      DB_USERNAME: app_user
      DB_PASSWORD: app_password
      JWT_SECRET: dev-only-secret-key-change-this-before-any-real-deployment-1234567890
    depends_on:
      mysql:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    networks:
      - health-app-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8086/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------------
  # STEP 8: location-service — live GPS tracking
  # ---------------------------------------------------------------
  location-service:
    build: ./location-service
    container_name: location-service
    restart: unless-stopped
    ports:
      - "8087:8087"
    environment:
      EUREKA_URI: http://discovery-server:8761/eureka/
      CONFIG_SERVER_URI: http://config-server:8888
      DB_URL: jdbc:mysql://mysql:3306/location_db
      DB_USERNAME: app_user
      DB_PASSWORD: app_password
      JWT_SECRET: dev-only-secret-key-change-this-before-any-real-deployment-1234567890
    depends_on:
      mysql:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    networks:
      - health-app-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8087/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------------
  # STEP 9: frontend — React app
  # ---------------------------------------------------------------
  frontend:
    build: ./frontend
    container_name: frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api-gateway
    networks:
      - health-app-network
