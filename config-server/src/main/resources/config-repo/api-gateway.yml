# api-gateway specific overrides.
spring:
  cloud:
    gateway:
      routes:
        # More specific routes must come before broader ones — Gateway matches top-down.
        - id: contact-service-nested
          uri: lb://contact-service
          predicates:
            - Path=/api/users/*/contacts
        - id: contact-service
          uri: lb://contact-service
          predicates:
            - Path=/api/contacts/**
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**
        - id: emergency-service
          uri: lb://emergency-service
          predicates:
            - Path=/api/emergency/**
        - id: facility-service
          uri: lb://facility-service
          predicates:
            - Path=/api/facilities/**
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**
        - id: membership-service
          uri: lb://membership-service
          predicates:
            - Path=/api/memberships/**
        - id: location-service
          uri: lb://location-service
          predicates:
            - Path=/api/location/**
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      # Dev-only: wide-open CORS so the React app (served on its own port) can call
      # the Gateway directly. Lock this down to a real origin list before any deployment.
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
