server:
  port: 8081

spring:
  application:
    name: user-service
  config:
    import: "optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}"

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/user_db}
    username: ${DB_USERNAME:app_user}
    password: ${DB_PASSWORD:app_password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only validates entities match it
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-key-change-this-before-any-real-deployment-1234567890}
    access-token-expiration-ms: 900000        # 15 minutes
    refresh-token-expiration-days: 7

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
